version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - dupl
    - durationcheck
    - errorlint
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - nilerr
    - nilnil
    - prealloc
    - revive
    - unconvert
    - unparam
    - whitespace
  settings:
    dupl:
      threshold: 100
    gocyclo:
      min-complexity: 20
    revive:
      confidence: 0.8
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: "(.+)_test\\.go"
        linters:
          - dupl
          - gocyclo
          - gosec
